{% extends 'base.html' %}

{% block title %}Entrar no AutoFlow SaaS{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center -m-8 p-4">
    <div class="w-full max-w-md">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 shadow-xl shadow-blue-500/25 mb-4">
                <i data-lucide="sparkles" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">AutoFlow Platform</h1>
            <p class="text-sm text-slate-400 mt-1">Plataforma SaaS de Gestão de Estética & Lava-Jato</p>
        </div>

        <!-- Login Card -->
        <div class="glass-panel p-8 rounded-3xl shadow-2xl border border-slate-800">
            <h2 class="text-lg font-bold text-white mb-6">Acesse seu Painel</h2>

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">E-mail Corporativo</label>
                    {{ form.username }}
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Senha</label>
                    {{ form.password }}
                </div>

                <button type="submit" class="w-full mt-2 py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg shadow-blue-600/30 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
                    <span>Entrar no Sistema</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <!-- Demo quick fill accounts -->
            <div class="mt-8 pt-6 border-t border-slate-800">
                <p class="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider text-center">Acessos Rápidos de Demonstração:</p>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button" onclick="fillCredentials('dono@autobrilho.com', 'dono')" class="p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-amber-500/30 text-left transition-colors flex items-center justify-between group">
                        <div>
                            <span class="text-xs font-bold text-amber-300 block">Auto Brilho VIP (Plano Premium)</span>
                            <span class="text-[11px] text-slate-400">dono@autobrilho.com</span>
                        </div>
                        <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold">PREMIUM</span>
                    </button>

                    <button type="button" onclick="fillCredentials('dono.pro@teste.com', 'dono')" class="p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-blue-500/30 text-left transition-colors flex items-center justify-between group">
                        <div>
                            <span class="text-xs font-bold text-blue-300 block">Pro Wash Detail (Plano Pro)</span>
                            <span class="text-[11px] text-slate-400">dono.pro@teste.com</span>
                        </div>
                        <span class="text-[10px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-bold">PRO</span>
                    </button>

                    <button type="button" onclick="fillCredentials('dono.basico@teste.com', 'dono')" class="p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-700 text-left transition-colors flex items-center justify-between group">
                        <div>
                            <span class="text-xs font-bold text-slate-300 block">Lava-Jato Central (Plano Básico)</span>
                            <span class="text-[11px] text-slate-400">dono.basico@teste.com</span>
                        </div>
                        <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-bold">BÁSICO</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCredentials(email, pass) {
        document.querySelector('input[type="email"]').value = email;
        document.querySelector('input[type="password"]').value = pass;
    }
</script>
{% endblock %}
