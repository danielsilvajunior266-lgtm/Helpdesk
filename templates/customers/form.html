{% extends 'base.html' %}

{% block title %}Novo Cliente - AutoFlow{% endblock %}
{% block header_title %}Cadastrar Novo Cliente{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="glass-panel p-8 rounded-3xl border border-slate-800 shadow-xl">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Nome Completo / Razão Social</label>
                <input type="text" name="name" required placeholder="Ex: João da Silva ou Empresa Transportes Ltda" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Telefone / WhatsApp</label>
                    <input type="text" name="phone" required placeholder="(11) 98765-4321" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">CPF / CNPJ</label>
                    <input type="text" name="document" placeholder="000.000.000-00" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">E-mail</label>
                <input type="email" name="email" placeholder="cliente@email.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Tipo de Faturamento</label>
                <select name="billing_type" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="per_service">Avulso (Pagamento por Serviço / Direto no Caixa)</option>
                    <option value="monthly">Faturamento Mensal para Frotas (Acúmulo de Fatura Consolidada)</option>
                </select>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                <a href="{% url 'customers:list' %}" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm transition-colors">Cancelar</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg shadow-blue-600/25 transition-all">
                    Salvar Cliente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
